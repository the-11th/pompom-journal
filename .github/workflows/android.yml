name: Build phone-usage APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# The release step needs write access to create tags/releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override v3's default, which includes the removed "tools" package.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk phone-usage.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-usage-apk
          path: phone-usage.apk

      # Publish as a GitHub Release asset named phone-usage.apk so the
      # always-latest URL resolves:
      #   https://github.com/<owner>/todo-cli/releases/latest/download/phone-usage.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-app-v${{ github.run_number }}
          name: Phone usage app v${{ github.run_number }}
          files: phone-usage.apk
          fail_on_unmatched_files: true
