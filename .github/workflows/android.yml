name: Build Datapom APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# The release step needs write access to create tags/releases.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override v3's default, which includes the removed "tools" package.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk datapom.apk
          cp datapom.apk phone-usage.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: datapom-apk
          path: datapom.apk

      # Keep the old asset as an alias so existing Manage-page download links work.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: datapom-v${{ github.run_number }}
          name: Datapom v${{ github.run_number }}
          files: |
            datapom.apk
            phone-usage.apk
          fail_on_unmatched_files: true
